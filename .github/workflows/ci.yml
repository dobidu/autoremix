name: CI

on:
  push:
    branches: [native, main]
  pull_request:
    branches: [native, main]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build \
            libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxinerama-dev libxcursor-dev libxrandr-dev \
            libxcomposite-dev libxext-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libcurl4-openssl-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

  test-linux:
    # GCC 13 (24.04): GCC 11's libtsan reports a false "double lock of a
    # mutex" inside juce::Thread::startThread on every thread start.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            ninja-build xvfb \
            libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxinerama-dev libxcursor-dev libxrandr-dev \
            libxcomposite-dev libxext-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libcurl4-openssl-dev
          cmake --version

      # Newer runner kernels use 32 bits of mmap ASLR entropy, which breaks
      # ThreadSanitizer's shadow mapping ("unexpected memory mapping").
      # The tsan preset also runs tests under 'setarch -R'; this is a second
      # safety net for the runner.
      - name: Reduce ASLR entropy for TSAN
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Cache FetchContent sources (asan)
        uses: actions/cache@v4
        with:
          path: build-asan/_deps
          key: deps-asan-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'plugin/CMakeLists.txt') }}

      - name: Cache FetchContent sources (tsan)
        uses: actions/cache@v4
        with:
          path: build-tsan/_deps
          key: deps-tsan-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'plugin/CMakeLists.txt') }}

      - name: Configure (ASan + UBSan)
        run: cmake --preset asan
      - name: Build tests (ASan + UBSan)
        run: cmake --build --preset asan --target autoremix_tests autoremix_plugin_tests
      - name: Test (ASan + UBSan)
        run: xvfb-run -a ctest --preset asan

      - name: Configure (TSAN)
        run: cmake --preset tsan
      - name: Build tests (TSAN)
        run: cmake --build --preset tsan --target autoremix_tests autoremix_plugin_tests
      - name: Test (TSAN)
        run: xvfb-run -a ctest --preset tsan

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs
          path: |
            build-asan/Testing/Temporary/LastTest.log
            build-tsan/Testing/Temporary/LastTest.log
